<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>    
<body>
    <header class="header">
        <div class="header__inner">
            <a href="index.html" class="logo">OctoShop</a>
            <div class="search">
                <input type="text" class="search__input" placeholder="Поиск товаров...">
                <button class="search__button">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div class="user-actions">
                <a href="#" class="user-actions__link" title="Избранное">
                    <i class="fas fa-heart"></i>
                </a>
                <a href="#" class="user-actions__link" title="Профиль">
                    <i class="fas fa-user"></i>
                </a>
                <a href="#" class="user-actions__link" title="Заказы">
                    <i class="fas fa-box"></i>
                </a>
                <a href="#" class="user-actions__link" title="Корзина">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="user-actions__count">0</span>
                </a>
            </div>
        </div>
    </header>
    <main>
    <h1 class="catalog-title">Каталог товаров</h1>
    <div class="products"></div>
    </main>
    <footer>
        <p>&copy; 2026 Мой магазин</p>
        <div>
            <a href="#">Instagram</a>
            <a href="#">Telegram</a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
